
name: Kiid Angel Vocal Suite Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure VST3 project
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile plugin
        run: cmake --build build --config Release --target KiidAngelVocalSuite_VST3 --parallel 2

      - name: Upload VST3 build
        uses: actions/upload-artifact@v4
        with:
          name: Kiid-Angel-Vocal-Suite-VST3
          path: build/KiidAngelVocalSuite_artefacts/Release/VST3/
          if-no-files-found: error
